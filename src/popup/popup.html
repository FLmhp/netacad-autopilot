<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAcad Autopilot</title>
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #111827;
      background: #34d399;
    }

    button:disabled {
      cursor: progress;
      opacity: 0.7;
    }

    p {
      margin: 12px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: #d1d5db;
    }

    p[data-error="true"] {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <h1>NetAcad Autopilot</h1>
  <button id="start-auto-flow" type="button">Start</button>
  <p id="status">Idle</p>
  <script src="popup.js"></script>
</body>
</html>
